name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [master]
  # Rebuild daily just after midnight Singapore time (UTC+8) so event
  # statuses derived from dates (Upcoming/Ongoing/Completed) roll over.
  schedule:
    - cron: '5 16 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time; queued runs wait instead of failing on an
# in-progress deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Astro
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
